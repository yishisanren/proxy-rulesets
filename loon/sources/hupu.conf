#!name = 虎扑 App 净化
#!desc = 清空虎扑 goblin.hupu.com 广告接口返回的 ads 数组，异常响应原样放行
#!author = yishisanren
#!homepage = https://github.com/akaagiao1/quantumult-x-scripts
# 派生自 akaagiao1/quantumult-x-scripts 的 hupu-ad.conf 与 hupu-ad-test.js（8.2.67 抓包）。
# 上游把版本号写死在接口路径里（/3/8.2.67/interfaceAd/getOther/...），App 一更新路径就变，
# 规则会静默失效且不报错。这里改成任意版本号，其余匹配条件与处理逻辑不变。
# ad_code 也不再要求等于 1：只清 ads 数组，其他字段不动。
^https:\/\/goblin\.hupu\.com\/3\/[0-9]+\.[0-9]+\.[0-9]+\/interfaceAd\/getOther\/(v3|batch)(\?|$) url script-response-body loon/sources/hupu-ad.js
hostname = goblin.hupu.com