name: Sync Loon plugins

# 上游 QX 规则（ZenmoFeiShi/Qx）更新频繁，每天拉取一次重新转换，
# 只有产物变化时才提交。转换器遇到不认识的写法会直接失败，不会悄悄丢规则。
on:
  schedule:
    - cron: "17 1 * * *"
  push:
    branches: [main]
    paths:
      - "loon/sources.json"
      - "loon/compat/**"
      - "scripts/qx2loon.py"
      - "tests/test_loon_plugins.py"
      - "tests/loon_harness.js"
      - ".github/workflows/loon-plugins.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-loon-plugins
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Convert upstream QX snippets
        run: python scripts/qx2loon.py

      - name: Test generated plugins
        run: python -m unittest tests.test_loon_plugins -v

      - name: Commit regenerated plugins
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loon/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: sync Loon plugins from ZenmoFeiShi/Qx"
            git push
          fi
